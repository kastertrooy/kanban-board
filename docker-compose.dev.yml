cat << 'EOF' > docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kanban-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - kanban-net

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kanban-net

  frontend:
    build:
      context: ./frontend
      # Передаем переменные внутрь Dockerfile при сборке
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    networks:
      - kanban-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Передаем домен для генерации шаблона Nginx
      - DOMAIN=${DOMAIN}
    volumes:
      # Подключаем папку с шаблонами
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - kanban-net

volumes:
  postgres_data:
  redis_data:

networks:
  kanban-net:
    driver: bridge
EOF
